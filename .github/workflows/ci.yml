name: Vouch CI - Test & Money Invariants

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Run Invariant & API Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: vouch_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest pytest-asyncio pytest-mock

      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:root@localhost:5432/vouch_db
          PAYMENT_PROVIDER: mock
          LLM_PROVIDER: mock
          SECRET_KEY: test-secret-key-1234567890
          PAYPAL_WEBHOOK_ID: mock-webhook-id
        run: |
          pytest -v

      - name: Verify Tamper-Evident Hash Chain
        env:
          DATABASE_URL: postgresql://postgres:root@localhost:5432/vouch_db
        run: |
          python scripts/verify_chain.py

