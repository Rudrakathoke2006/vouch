services:
  postgres:
    image: postgres:16-alpine
    container_name: vouch_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vouch_user
      POSTGRES_PASSWORD: vouch_password
      POSTGRES_DB: vouch_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vouch_user -d vouch_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

