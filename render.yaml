services:
  - type: web
    name: vouch-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: ENVIRONMENT
        value: production
      - key: PAYMENT_PROVIDER
        value: mock
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_MODEL
        value: gemini-2.0-flash
      - key: DATABASE_URL
        fromDatabase:
          name: vouch-postgres
          property: connectionString

databases:
  - name: vouch-postgres
    plan: free
    databaseName: vouch_db
    user: vouch_user

